<!-- =========================

========================== -->

<script>

    // =====================================
    // ELEMENTS
    // =====================================

    const input =
        document.getElementById("messageInput");

    const chatInner =
        document.getElementById("chatInner");

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    const history =
        document.getElementById("history");

    let firstMessage = true;

    let isSending = false;


    // =====================================
    // ENTER KEY
    // =====================================

    function handleKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }


    // =====================================
    // SUGGESTION
    // =====================================

    function useSuggestion(text) {

        input.value = text;

        input.focus();

        sendMessage();

    }


    // =====================================
    // SEND MESSAGE
    // =====================================

    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        if (isSending) {
            return;
        }


        isSending = true;


        // Remove welcome

        if (firstMessage) {

            if (welcome) {
                welcome.remove();
            }

            firstMessage = false;

        }


        // User message

        addMessage(
            "You",
            message,
            true
        );


        // Clear input

        input.value = "";

        input.style.height = "52px";


        // Thinking

        const loading =
            addMessage(
                "G AI",
                "Thinking...",
                false
            );


        try {

            console.log(
                "📤 Sending message:",
                message
            );


            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    message
                            })
                    }
                );


            console.log(
                "📡 Server status:",
                response.status
            );


            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            console.log(
                "✅ G-AI response:",
                data
            );


            const messageBody =
                loading.querySelector(
                    ".message-body"
                );


            if (messageBody) {

                messageBody.innerHTML = `

                    <div class="message-name">
                        G AI
                    </div>

                    <div>
                        ${escapeHtml(
                            data.reply ||
                            "No response received."
                        )}
                    </div>

                `;

            }


            // Save history

            addHistory(message);


        } catch (error) {

            console.error(
                "❌ G-AI Error:",
                error
            );


            const messageBody =
                loading.querySelector(
                    ".message-body"
                );


            if (messageBody) {

                messageBody.innerHTML = `

                    <div class="message-name">
                        G AI
                    </div>

                    <div>
                        ❌ ${escapeHtml(
                            error.message
                        )}
                    </div>

                `;

            }


        } finally {

            isSending = false;

            chat.scrollTop =
                chat.scrollHeight;

        }

    }


    // =====================================
    // ADD MESSAGE
    // =====================================

    function addMessage(
        name,
        text,
        isUser
    ) {

        const message =
            document.createElement("div");


        message.className =
            "message " +
            (
                isUser
                    ? "user"
                    : "assistant"
            );


        message.innerHTML = `

            <div class="avatar">
                ${
                    isUser
                        ? "👤"
                        : "✦"
                }
            </div>


            <div class="message-body">

                <div class="message-name">
                    ${escapeHtml(name)}
                </div>

                <div>
                    ${escapeHtml(text)}
                </div>

            </div>

        `;


        chatInner.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;


        return message;

    }


    // =====================================
    // ESCAPE HTML
    // =====================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");


        div.textContent =
            String(text);


        return div.innerHTML;

    }


    // =====================================
    // ADD HISTORY
    // =====================================

    function addHistory(message) {

        if (!history) {
            return;
        }


        const item =
            document.createElement("div");


        item.className =
            "history-item";


        item.textContent =
            message;


        item.title =
            message;


        history.prepend(item);


        let savedHistory =
            JSON.parse(
                localStorage.getItem(
                    "gai_history"
                ) || "[]"
            );


        savedHistory.unshift(message);


        savedHistory =
            savedHistory.slice(0, 20);


        localStorage.setItem(
            "gai_history",
            JSON.stringify(
                savedHistory
            )
        );

    }


    // =====================================
    // LOAD HISTORY
    // =====================================

    function loadHistory() {

        if (!history) {
            return;
        }


        let savedHistory =
            JSON.parse(
                localStorage.getItem(
                    "gai_history"
                ) || "[]"
            );


        savedHistory.forEach(
            function(message) {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.textContent =
                    message;


                item.title =
                    message;


                history.appendChild(item);

            }
        );

    }


    // =====================================
    // NEW CHAT
    // =====================================

    function newChat() {

        location.reload();

    }


    // =====================================
    // SIDEBAR
    // =====================================

    function toggleSidebar() {

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        if (sidebar) {

            sidebar.classList.toggle(
                "open"
            );

        }

    }


    // =====================================
    // FILE SELECTED
    // =====================================

    function fileSelected(
        inputElement
    ) {

        if (
            !inputElement ||
            !inputElement.files ||
            !inputElement.files.length
        ) {
            return;
        }


        const file =
            inputElement.files[0];


        console.log(
            "📎 File selected:",
            file.name
        );


        alert(
            "📎 File selected: " +
            file.name
        );


        inputElement.value = "";

    }


    // =====================================
    // VOICE INPUT
    // =====================================

    function voiceInput() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Voice input is not supported in this browser."
            );

            return;

        }


        const recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-IN";


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.start();


        recognition.onstart =
            function() {

                console.log(
                    "🎤 Voice recognition started"
                );

            };


        recognition.onresult =
            function(event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript;


                input.value =
                    transcript;


                input.focus();


                input.style.height =
                    "52px";


                input.style.height =
                    Math.min(
                        input.scrollHeight,
                        150
                    ) + "px";

            };


        recognition.onerror =
            function(event) {

                console.error(
                    "🎤 Voice error:",
                    event.error
                );

            };

    }


    // =====================================
